# Parametri della pipeline. Si tarano SOLO sul campione di sviluppo (~3k target);
# prima della corsa finale su tutti i target si imposta frozen = true e non si toccano più.
frozen = true

[dataset]
sector = 103
cadence_s = 120          # solo curve SPOC a 2 minuti
data_release = 141       # DRN141 (sector 103), l'unica release accettata
# settori con note di rilascio pubblicate usati per la persistenza; 105-107 esclusi (v1)
persistence_sectors_max = 104

[sample]
size = 3000
seed = 103
# limiti delle classi di magnitudine TESS (Tmag); allocazione proporzionale
tmag_edges = [-99.0, 8.0, 9.0, 10.0, 11.0, 12.0, 13.0, 99.0]

[clean]
# bitmask dei flag QUALITY scartati: default di lightkurve 2.6 (17087) meno
# "Impulsive outlier" (512), che può coincidere con eventi brevi reali: resta in colonna
# e lo valuta la fase di scarto degli artefatti.
quality_bitmask = 16575
gap_days = 0.5           # un buco più lungo separa due segmenti
min_segment_days = 0.5   # frammenti più corti tra due buchi scartati (cadenze contate nel riepilogo)
min_points = 1000        # curve con meno cadenze valide escluse

[features]
# periodogramma di Lomb-Scargle sulla curva non appiattita, in bin per velocità
ls_bin_minutes = 10.0
ls_min_period_d = 0.05       # 72 min, sopra il limite di Nyquist dei bin da 10 min
ls_max_period_d = 13.0       # circa metà della durata del settore: almeno due cicli
ls_samples_per_peak = 5
# appiattimento (mediana mobile) per BLS ed eventi: lungo ~3 volte il transito più lungo cercato
flatten_window_d = 1.0
# ricerca di transiti (Box Least Squares) sulla curva appiattita
bls_bin_minutes = 10.0
bls_min_period_d = 0.5
bls_max_period_d = 13.0      # almeno due transiti nel settore
bls_durations_h = [1.0, 2.0, 4.0, 8.0]
bls_frequency_factor = 1.0   # passo della griglia di periodi (1 = default di astropy)
# eventi isolati: almeno event_min_points cadenze consecutive oltre event_sigma σ robuste
event_sigma = 4.0
event_min_points = 3         # 6 minuti: un punto singolo (raggio cosmico) non basta

[models]
# ingressi: design_matrix in models.py (ampiezze in unità di rumore punto-punto, scalatura robusta)
seed = 103
if_n_estimators = 500
if_max_samples = 256         # default di Isolation Forest: sottocampioni piccoli isolano meglio
lof_n_neighbors = 50         # vicini per la densità locale: più del default (20) per stabilità
compare_top_k = [50, 100, 300]
top_n = 50                   # candidati con grafici

[artifacts]
# scarto esplicito degli artefatti (src/vdxtess/artifacts.py): criteri in ordine fisso, il primo
# che fallisce dà il motivo. Soglie decise sul campione di sviluppo (README, "Scarto degli artefatti").
# criteri sulla stella
max_mad_std = 0.3            # dispersione relativa oltre 0.3: mediana PDCSAP vicina a zero
min_crowdsap = 0.5           # meno di metà del flusso in apertura viene dal target
max_corr_centr = 0.5         # |r| del flusso appiattito con un centroide
max_abs_corr_bkg = 0.3       # |r| del flusso appiattito con il fondo
# criteri sull'evento che guida il punteggio (dip, brillamento o transito BLS)
min_edge_d = 0.1             # evento più forte entro 0.1 d dal bordo di un segmento
max_q512_frac = 0.5          # metà o più delle cadenze dell'evento con "Impulsive outlier"
# solo avvisi, non scartano
warn_centr_shift = 20.0      # ~95° percentile sugli eventi del campione; cresce con l'SNR dell'evento
warn_crowdsap = 0.8

[crossmatch]
# FASE 4 (src/vdxtess/crossmatch.py, scripts/fase4.py)
match_radius_arcsec = 5.0        # oggetto di catalogo più vicino entro 5" = il target
neighbor_radius_arcsec = 42.0    # 2 pixel TESS: variabili note più lontane sono possibili contaminanti
coincidence_window_d = 0.05      # eventi di altre stelle sullo stesso CCD entro ±1.2 h
coincidence_max_p = 0.001        # p di Poisson sotto cui l'evento è "sospetto_sistematica"
persistence_min_snr = 10.0       # evento dello stesso tipo in un altro settore con SNR >= 10
